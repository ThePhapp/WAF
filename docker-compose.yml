services:
  web:
    image: bkimminich/juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:nginx
    ports:
      - "8080:8080"
    environment:
      BACKEND: "http://web:3000"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
    depends_on:
      - web
    restart: unless-stopped
