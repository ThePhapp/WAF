events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # -------------------------------------------------------------
    # PATTERN: GATEWAY OFFLOADING - RATE LIMITING
    # Giới hạn 10 request/giây tại Gateway (10r/s)
    # Trả về HTTP status 429 Too Many Requests khi vượt ngưỡng
    # -------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=gateway_rate_limit:10m rate=10r/s;
    limit_req_status 429;

    # Upstream backend microservices
    upstream user_service {
        server user-service:3001;
    }

    upstream order_service {
        server order-service:3002;
    }

    upstream aggregator_service {
        server aggregator-service:3000;
    }

    server {
        listen 80;
        server_name localhost;
        port_in_redirect off;

        # Áp dụng rate limiting 10 req/s cho toàn bộ các route
        limit_req zone=gateway_rate_limit burst=5 nodelay;

        # Custom JSON errors for Gateway Offloading
        error_page 401 = @error401;
        error_page 429 = @error429;

        location @error401 {
            default_type application/json;
            return 401 '{"status":"error","pattern":"Gateway Offloading (JWT)","error":"Unauthorized","message":"Invalid or missing JWT token. Rejected at API Gateway."}';
        }

        location @error429 {
            default_type application/json;
            return 429 '{"status":"error","pattern":"Gateway Offloading (Rate Limiting)","error":"Too Many Requests","message":"Rate limit of 10 requests/second exceeded at API Gateway."}';
        }

        # Health check của Gateway
        location /health {
            default_type application/json;
            return 200 '{"gateway":"Nginx API Gateway","status":"UP","rateLimit":"10r/s","jwtOffloading":true}';
        }

        # -------------------------------------------------------------
        # PATTERN: GATEWAY OFFLOADING - JWT VERIFICATION SUBREQUEST
        # Nginx gửi subrequest kiểm tra JWT tới user-service.
        # Nếu hợp lệ (200), Nginx lấy thông tin user đẩy vào headers backend.
        # Nếu không hợp lệ (401), Nginx chặn ngay tại cửa ngõ.
        # -------------------------------------------------------------
        location = /_auth_verify {
            internal;
            proxy_pass http://user_service/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # -------------------------------------------------------------
        # PUBLIC ROUTES (Không cần JWT)
        # Cho phép đăng ký và đăng nhập lấy JWT token
        # -------------------------------------------------------------
        location /users/login {
            auth_request off;
            proxy_pass http://user_service/users/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /users/register {
            auth_request off;
            proxy_pass http://user_service/users/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # -------------------------------------------------------------
        # PATTERN: GATEWAY AGGREGATION
        # Endpoint /dashboard gộp thông tin user và đơn hàng của user đó
        # Được bảo vệ bởi JWT Offloading
        # -------------------------------------------------------------
        location /dashboard {
            auth_request /_auth_verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://aggregator_service/dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Email $auth_user_email;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_set_header Authorization $http_authorization;
        }

        # -------------------------------------------------------------
        # PATTERN: GATEWAY ROUTING
        # Định tuyến /users và /orders tới đúng microservice tương ứng.
        # Kiểm tra JWT offloading cho các API cần xác thực.
        # -------------------------------------------------------------
        location /users {
            auth_request /_auth_verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Email $auth_user_email;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_set_header Authorization $http_authorization;
        }

        location /orders {
            auth_request /_auth_verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Email $auth_user_email;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
